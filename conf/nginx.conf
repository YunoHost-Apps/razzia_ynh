root __INSTALL_DIR__/packages/web/dist;
index index.html;

#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {
      try_files $uri $uri/ /index.html;
}

location __PATH__/branding/ {
        alias __DATA_DIR__/config/branding/;
}

location __PATH__/media/ {
        alias __DATA_DIR__/config/media/;
        types {
            image/png png;
            image/jpeg jpg;
            image/webp webp;
            image/gif gif;
            audio/mpeg mp3;
            audio/ogg ogg;
            audio/wav wav;
            video/mp4 mp4;
            video/webm webm;
        }
        default_type application/octet-stream;
        more_set_headers "X-Content-Type-Options: nosniff";
}

location __PATH__/api {
        client_max_body_size 101m;
        proxy_pass http://127.0.0.1:__PORT_SOCKET__;
        include proxy_params_no_auth;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
}

location __PATH__/ws {
        proxy_pass http://127.0.0.1:__PORT_SOCKET__;
        include proxy_params_no_auth;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
}
