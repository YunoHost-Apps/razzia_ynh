root __INSTALL_DIR__/packages/web/dist;
index index.html;

#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {
      try_files $uri $uri/ /index.html;
  }

location __PATH__/ws {
    proxy_pass http://127.0.0.1:__PORT__;
    include proxy_params_no_auth;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location __PATH__/api {
    client_max_body_size 101m;
    proxy_pass http://127.0.0.1:__PORT_SOCKET__;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location __PATH__/icon.svg {
    alias __INSTALL_DIR__/packages/web/dist/icon.svg;
}

location __PATH__/branding/ {
    alias /app/config/branding/;
}

location __PATH__/media/ {
    alias /app/config/media/;
    types {
        image/png png;
        image/jpeg jpg;
        image/webp webp;
        image/gif gif;
        audio/mpeg mp3;
        audio/ogg ogg;
        audio/wav wav;
        video/mp4 mp4;
        video/webm webm;
    }
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff;
}
