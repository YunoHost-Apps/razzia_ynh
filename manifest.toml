#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "razzia"
name = "Razzia"
description.en = "Quiz platform for smaller events"
description.fr = "Plateforme de quiz pour les petits événements"

version = "4.0.2~ynh1"

maintainers = ["Thovi98"]

[upstream]
license = "MIT"
code = "https://github.com/Ralex91/Razzia"
fund = "https://ko-fi.com/Ralex91"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.password]
    type = "password"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/Ralex91/Razzia/archive/refs/tags/4.0.2.tar.gz"
    sha256 = "b70b00abe9e99bfc668d095ed2b20057097a2357fdf50e5c5ac75aab5df9b084"

    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    subdirs = ["config"]
    group = "www-data:r-x"
    
    [resources.permissions]
    main.url = "/"

    manager.url = "/manager"
    manager.allowed = "all_users"
    manager.show_tile = true

    api.url = "/api"
    api.auth_header = false
    api.allowed = "visitors"
    api.show_tile = false
    api.protected = true

    media.url = "/media"
    media.auth_header = false
    media.allowed = "visitors"
    media.show_tile = false
    media.protected = true

    branding.url = "/branding"
    branding.auth_header = false
    branding.allowed = "visitors"
    branding.show_tile = false
    branding.protected = true

    [resources.ports]
    main.default = 3000
	socket.default = 3001
	
    [resources.nodejs]
    version = "24"
