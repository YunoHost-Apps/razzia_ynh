#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "razzia"
name = "Razzia"
description.en = "Quiz platform for smaller events"
description.fr = "Plateforme de quiz pour les petits événements"

version = "4.0.0~ynh1"

maintainers = ["Thovi98"]

[upstream]
license = "MIT"
code = "https://github.com/Ralex91/Razzia"
fund = "https://ko-fi.com/Ralex91"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = "all"
multi_instance = false # can't be true because of fixed Web Socket port

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.password]
    type = "password"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/Ralex91/Razzia/archive/refs/tags/4.0.0.tar.gz"
    sha256 = "99eeb4dc5b6818738acf11710146e907bd0136f4bec452fee04609c9c5f65cb0"

    autoupdate.strategy = "latest_github_tag"

    [resources.system_user]

    [resources.install_dir]
    
    [resources.permissions]
    main.url = "/"

    [resources.ports]
	main.default = 3001    # Upstream WS need Port 3001
	main.fixed = true
	
    [resources.nodejs]
    version = "24"
